<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#f6f8ec">
<link rel="manifest" href="manifest.json">
<style>
  /* === ПОЛНЫЙ ФИКС ВМЕЩЕНИЯ В ЭКРАН === */
  html {
    height: 100%;
    height: 100dvh;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
  }
  body {
    margin: 0 !important;
    padding: 0 !important;
    width: 100vw !important;
    height: 100% !important;
    height: 100dvh !important;
    min-height: 100dvh !important;
    max-height: 100dvh !important;
    overflow: hidden !important;
    position: fixed !important;
    inset: 0 !important;
    overscroll-behavior: none !important;
    background: #f6f8ec;
    -webkit-tap-highlight-color: transparent;
  }
  #root {
    width: 100vw !important;
    height: 100dvh !important;
    max-width: 100vw !important;
    max-height: 100dvh !important;
    overflow: hidden !important;
    position: relative !important;
    display: flex !important;
    flex-direction: column !important;
  }
  /* Главный контейнер игры - делаем скролл ВНУТРИ, а не страницей */
  #root > div,
  #root > div > div {
    width: 100% !important;
    max-width: 100vw !important;
    box-sizing: border-box !important;
  }
  #root > div {
    flex: 1 1 auto !important;
    height: 100% !important;
    max-height: 100dvh !important;
    overflow-y: auto !important;
    overflow-x: hidden !important;
    -webkit-overflow-scrolling: touch !important;
    overscroll-behavior: contain !important;
    padding-bottom: env(safe-area-inset-bottom) !important;
  }
  /* Все карточки и блоки - уменьшаем отступы на мобиле */
  @media (max-width: 768px) {
    /* Тайтл и заголовки */
    h1 { font-size: clamp(24px, 7vw, 36px) !important; line-height: 1.1 !important; }
    h2 { font-size: clamp(18px, 5vw, 24px) !important; }
    p { font-size: clamp(13px, 3.8vw, 16px) !important; }
    /* Любые большие паддинги */
    [class*="p-8"] { padding: 16px !important; }
    [class*="p-6"] { padding: 14px !important; }
    [class*="p-10"] { padding: 18px !important; }
    [class*="gap-6"] { gap: 12px !important; }
    [class*="gap-8"] { gap: 14px !important; }
    /* Инпуты */
    input, select, textarea {
      font-size: 16px !important; /* убирает зум на iOS */
      max-width: 100% !important;
    }
    /* Карточки уровней */
    [class*="rounded-[2"] { border-radius: 20px !important; }
  }
  /* Скрываем скроллбар но оставляем скролл */
  #root > div::-webkit-scrollbar { width: 0; height: 0; }
  
  /* Канвас / 3D если есть */
  canvas { 
    max-width: 100vw !important; 
    max-height: 60vh !important;
    width: 100% !important;
    object-fit: contain !important;
  }

  /* QR UI */
  #qr-overlay { position: fixed; inset: 0; z-index: 999999; background: rgba(0,0,0,0.75); backdrop-filter: blur(10px); display: none; align-items: center; justify-content: center; padding: 20px; }
  #qr-overlay.open { display: flex; }
  #qr-card { background: white; border-radius: 24px; padding: 20px; width: 100%; max-width: 340px; text-align: center; }
</style>

<style id="ovz-a11y-instant">
html.ovz-large { font-size: 112%; }
html.ovz-large body { line-height: 1.6; }
html.ovz-large .text-\[11px\] { font-size: 13px !important; }
html.ovz-large .text-\[12px\] { font-size: 14px !important; }
html.ovz-large .text-\[13px\] { font-size: 16px !important; }
html.ovz-large .text-\[14px\] { font-size: 18px !important; }
html.ovz-contrast { filter: contrast(1.35); }
html.ovz-contrast body { background: #000 !important; }
html.ovz-contrast .bg-\[\#e8f5d8\] { background: #000 !important; }
html.ovz-contrast .bg-white { background: #111 !important; color: #fff !important; border-color: #fff !important; }
html.ovz-contrast .bg-zinc-50 { background: #1a1a1a !important; color: #fff !important; }
html.ovz-contrast .bg-violet-50 { background: #1a1a1a !important; border-color: #ffeb3b !important; }
html.ovz-contrast .bg-amber-50 { background: #1a1a1a !important; border-color: #ffeb3b !important; }
html.ovz-contrast .text-zinc-900 { color: #fff !important; }
html.ovz-contrast .text-zinc-600 { color: #ffeb3b !important; }
html.ovz-contrast .text-zinc-500 { color: #fff !important; }
html.ovz-contrast .border-zinc-200 { border-color: #fff !important; border-width: 2px !important; }
html.ovz-contrast button { border: 2px solid #fff !important; }
html.ovz-contrast canvas { filter: contrast(1.6) brightness(1.1); border: 3px solid #fff !important; }
</style>

<script>
(function(){
  try{
    var lt = localStorage.getItem("ovz_largeText")==="1";
    var hc = localStorage.getItem("ovz_highContrast")==="1";
    if(lt){ document.documentElement.classList.add("ovz-large"); }
    if(hc){ document.documentElement.classList.add("ovz-contrast"); }
    // Also observe React changes via polling localStorage and via overriding setItem for instant
    var _setItem = localStorage.setItem;
    localStorage.setItem = function(k,v){
      _setItem.apply(this, arguments);
      try{
        if(k==="ovz_largeText"){
          document.documentElement.classList.toggle("ovz-large", v==="1");
          document.body && document.body.classList.toggle("ovz-large", v==="1");
        }
        if(k==="ovz_highContrast"){
          document.documentElement.classList.toggle("ovz-contrast", v==="1");
          document.body && document.body.classList.toggle("ovz-contrast", v==="1");
        }
      }catch(e){}
    };
  }catch(e){}
})();
</script>

р. 9)",options:["1 бит","8 бит","100 бит","1024 бит"],correct:1,explain:"1 байт = 8 бит. Запомни: байт больше бита в 8 раз.",hint:"\uD83D\uDCA1 Подсказка: Байт — это 8 битов вместе, как 8 друзей.",learnText:"Байт - это группа из 8 бит. Как 8 бит вместе дают 1 байт. Это как 8 человек в одной команде. Байт уже может хранить одну букву, например букву А. Битов мало, а байтов больше - они сильнее.",emoji:"\uD83D\uDC68‍\uD83D\uDC69‍\uD83D\uDC67‍\uD83D\uDC66"},{id:3,label:"Вопрос 4",x:3,y:10.5,q:"Что такое ASCII? (стр. 15-16)",options:["Игра","Таблица кодов для букв и цифр","Вирус","Принтер"],correct:1,explain:"ASCII — таблица где каждой букве присвоен код.",hint:"\uD83D\uDCA1 Подсказка: ASCII помогает компьютеру понять буквы — у каждой буквы свой номер.",learnText:"ASCII - это таблица, где каждой букве и цифре дали свой номер. Компьютер не понимает буквы, он понимает только цифры. Поэтому придумали - буква А это номер 65, буква Б это 66. Так компьютер читает тексты.",emoji:"\uD83D\uDD24"},{id:4,label:"Вопрос 5",x:8,y:6.5,q:"Сколько байт в 1 Килобайте? (стр. 10)",options:["100 байт","1024 байта","1000 байт","8 байт"],correct:1,explain:"1 КБ = 1024 байта.",hint:"\uD83D\uDCA1 Подсказка: Компьютеры любят число 1024, а не 1000. Запомни 1024!",learnText:"Килобайт - это много байтов. 1 килобайт = 1024 байта. Почему 1024, а не 1000? Потому что компьютеры считают двойками: 2,4,8,16... и 1024 это 2 в 10 степени. Запомни просто - килобайт это примерно тысяча байтов.",emoji:"\uD83D\uDCE6"}]},{name:"Уровень 2 — Пазл-мир: собери знания",short:"\uD83E\uDDE9 Пазл-мир • Графика и растр",color:"#f2b94c",accent:"#a86f00",bg:"from-[#fffbeb] to-[#fcd34d]",questions:[{id:0,label:"Вопрос 1",x:2.5,y:2.8,q:"Что такое пиксель? (стр. 17 учебника)",options:["Большая картина","Маленькая точка из которой состоит картинка","Звук","Буква"],correct:1,explain:"Пиксель — маленькая точка, из точек состоит изображение.",hint:"\uD83D\uDCA1 Подсказка: Приблизь фото на телефоне — увидишь квадратики. Это пиксели.",learnText:"Пиксель - это маленькая точка, из которых состоит картинка на экране. Как мозаика - много маленьких цветных квадратиков вместе дают фото. Чем больше пикселей, тем четче картинка. Если приблизить фото - увидишь эти точки.",emoji:"\uD83D\uDDBC️"},{id:1,label:"Вопрос 2",x:12.5,y:2,q:"Какая графика состоит из пикселей? (стр. 32-33)",options:["Векторная","Растровая","Звуковая","Текстовая"],correct:1,explain:"Растровая графика — из пикселей, как фото.",hint:"\uD83D\uDCA1 Подсказка: Растровая — как мозаика из маленьких точек-пикселей. Фото — растровое.",learnText:"Растровая графика состоит из пикселей. Как фото на телефоне - каждая точка имеет свой цвет. Растровая картинка хранит информацию о каждом пикселе. Поэтому файл фото может быть большим.",emoji:"\uD83D\uDCF8"},{id:2,label:"Вопрос 3",x:14,y:8.5,q:"Что будет если сильно увеличить растровую картинку?",options:["Станет четче","Появятся квадратики-пиксели","Станет звуком","Исчезнет"],correct:1,explain:"При увеличении видны пиксели, картинка размывается.",hint:"\uD83D\uDCA1 Подсказка: Вспомни фото — увеличил сильно и видишь кубики.",learnText:"Если сильно увеличить растровую картинку, она становится размытой и видны квадратики-пиксели. Это как мозаику рассматривать в лупу - видны отдельные камешки. Поэтому растровую картинку нельзя увеличивать бесконечно.",emoji:"\uD83D\uDD0D"},{id:3,label:"Вопрос 4",x:3.2,y:11,q:"Какой формат — растровый? (стр. 35)",options:["TXT","JPEG, PNG","MP3","DOC"],correct:1,explain:"JPEG и PNG — растровые форматы фото.",hint:"\uD83D\uDCA1 Подсказка: Фото на телефоне обычно JPEG или PNG — это растровые.",learnText:"JPEG и PNG - это форматы растровых картинок. JPEG хорошо сжимает фото, а PNG умеет делать прозрачный фон. Когда ты сохраняешь фото с телефона - это обычно JPEG. А иконки с прозрачностью - PNG.",emoji:"\uD83D\uDDBC️"},{id:4,label:"Вопрос 5",x:8,y:4.2,q:"Где хранится растровая картинка?",options:["В виде формул","В виде точек-пикселей","В виде звука","В виде букв"],correct:1,explain:"Растр хранит каждую точку, цвет каждой точки-пикселя.",hint:"\uD83D\uDCA1 Подсказка: Растр помнит цвет каждой точки.",learnText:"Растровая картинка хранится как набор точек. Компьютер запоминает цвет каждой точки-пикселя. Как будто ты раскрашиваешь лист в клеточку и запоминаешь цвет каждой клетки. Много точек - точная картинка, но много памяти.",emoji:"\uD83C\uDFA8"}]},{name:"Уровень 3 — Вектор и цвет",short:"\uD83C\uDFA8 RGB-мир • Вектор и цвет",color:"#7ab8f5",accent:"#2d5ea6",bg:"from-[#dbeafe] to-[#93c5fd]",questions:[{id:0,label:"Вопрос 1",x:2,y:3.5,q:"Чем отличается векторная графика? (стр. 38)",options:["Из пикселей","Из линий и фигур по формулам","Из звуков","Из букв"],correct:1,explain:"Вектор — это линии и фигуры, описанные формулами, можно увеличивать без потери.",hint:"\uD83D\uDCA1 Подсказка: Вектор — это как чертеж: линии, круги. Увеличиваешь — не портится.",learnText:"Векторная графика состоит не из точек, а из линий и фигур по формулам. Как чертеж - круг, линия, прямоугольник. Компьютер помнит формулу: нарисовать круг радиусом 10. Поэтому вектор можно увеличивать без потери качества - формула пересчитается.",emoji:"\uD83D\uDCD0"},{id:1,label:"Вопрос 2",x:13.8,y:3,q:"Что такое RGB? (стр. 42)",options:["Игра","Модель цвета: Красный, Зеленый, Синий","Вирус","Принтер"],correct:1,explain:"RGB — Red Green Blue — три цвета из которых делают все остальные.",hint:"\uD83D\uDCA1 Подсказка: R=Красный, G=Зеленый, B=Синий. Из трех — все цвета.",learnText:"RGB - это три цвета: Красный, Зеленый, Синий. Red, Green, Blue. Из этих трех цветов делают все остальные. Как три краски - смешиваешь их в разных пропорциях и получаешь любой цвет. На экране каждый пиксель состоит из этих трех лампочек.",emoji:"\uD83C\uDF08"},{id:2,label:"Вопрос 3",x:13,y:11,q:"Какой цвет получится если смешать R+G+B по максимуму?",options:["Черный","Белый","Красный","Синий"],correct:1,explain:"Все три по максимуму = белый.",hint:"\uD83D\uDCA1 Подсказка: Все лампочки включи на максимум — будет белый свет.",learnText:"Если смешать красный, зеленый и синий на максимуме - получится белый. Как три фонарика светят вместе ярко - будет белый свет. А если все выключить - будет черный. Так работают экраны.",emoji:"\uD83D\uDCA1"},{id:3,label:"Вопрос 4",x:2.5,y:10,q:"Что такое разрешение экрана?",options:["Громкость","Количество пикселей по ширине и высоте","Вес компьютера","Скорость"],correct:1,explain:"Разрешение — сколько точек по горизонтали и вертикали, например 1920x1080.",hint:"\uD83D\uDCA1 Подсказка: Разрешение — сколько точек помещается на экране.",learnText:"Разрешение экрана - это сколько пикселей помещается по ширине и высоте. Например 1920 на 1080 - это значит 1920 точек в ряд и 1080 рядов. Чем больше разрешение, тем четче картинка, как будто больше деталей.",emoji:"\uD83D\uDDA5️"},{id:4,label:"Вопрос 5",x:8,y:8.8,q:"Векторную графику используют для...",options:["Фото с телефона","Логотипов и чертежей","Записи звука","Видео"],correct:1,explain:"Логотипы, иконки, чертежи — вектор, чтобы не портились при увеличении.",hint:"\uD83D\uDCA1 Подсказка: Логотип должен быть четким и маленьким и большим — это вектор.",learnText:"Векторную графику используют для логотипов, иконок, чертежей. Потому что логотип должен быть четким и на визитке, и на большом баннере. Вектор не портится при увеличении, поэтому для логотипов он идеален.",emoji:"✨"}]},{name:"Уровень 4 — Робо-завод: микросхемы",short:"\uD83E\uDD16 Робо-завод • Гироскоп и датчики",color:"#c084fc",accent:"#6d28d9",bg:"from-[#e5e7eb] to-[#a1a1aa]",questions:[{id:0,label:"Вопрос 1",x:2,y:3.5,q:"Что такое робот? (стр. 55 учебника)",options:["Живой человек","Машина которая выполняет задачи человека","Игрушка без моторов","Книга"],correct:1,explain:"Робот — машина, помогает человеку, может двигаться и думать по программе.",hint:"\uD83D\uDCA1 Подсказка: Робот — помощник человека, не живой, но работает сам.",learnText:"Робот - это машина, которая выполняет задачи человека. Он может двигаться, видеть датчиками и думать по программе. Как помощник - не живой, но может пылесосить, собирать детали, летать. Робот состоит из корпуса и программы.",emoji:"\uD83E\uDD16"},{id:1,label:"Вопрос 2",x:13.8,y:3,q:"Какие бывают роботы? (стр. 56)",options:["Только летающие","Промышленные, бытовые, военные и др.","Только игрушечные","Только из мультиков"],correct:1,explain:"Роботы бывают разные: на заводе, дома, в армии, в космосе.",hint:"\uD83D\uDCA1 Подсказка: Роботы и на заводе детали собирают, и дома пылесосят.",learnText:"Роботы бывают разные: промышленные на заводах собирают машины, бытовые дома пылесосят и моют, военные помогают в опасных местах, космические летают в космос. Как профессии у людей - у роботов тоже разные работы.",emoji:"\uD83C\uDFED"},{id:2,label:"Вопрос 3",x:13,y:11,q:"Что такое гироскопический датчик? (стр. 70)",options:["Измеряет температуру","Измеряет угол поворота и скорость вращения","Измеряет звук","Измеряет свет"],correct:1,explain:"Гироскоп измеряет на сколько градусов повернулся робот.",hint:"\uD83D\uDCA1 Подсказка: Гиро — про поворот. Как компас, но про угол.",learnText:"Гироскопический датчик измеряет угол поворота и скорость вращения. Как будто робот чувствует, насколько он повернулся. Повернулся на 90 градусов - датчик сказал программе. Без гироскопа робот не знает куда повернут.",emoji:"\uD83E\uDDED"},{id:3,label:"Вопрос 4",x:2.5,y:10,q:"Где используют гироскопы кроме роботов? (стр. 73)",options:["Только в роботах","В самолетах, вертолетах, телефонах","Только в книгах","Нигде"],correct:1,explain:"Гироскопы в самолетах, дронах, телефонах для ориентации.",hint:"\uD83D\uDCA1 Подсказка: Телефон понимает как ты его повернул — там гироскоп.",learnText:"Гироскопы используют не только в роботах, но и в самолетах, вертолетах, дронах и телефонах. В телефоне гироскоп понимает, как ты повернул экран. В самолете - помогает держать равновесие. Это очень полезный датчик.",emoji:"✈️"},{id:4,label:"Вопрос 5",x:8,y:8.8,q:"Робот — это...",options:["Только железо","Железо + программа","Только программа","Только батарейка"],correct:1,explain:"Робот — это корпус и программа которая им управляет.",hint:"\uD83D\uDCA1 Подсказка: Без программы робот — просто железка.",learnText:"Робот - это железо плюс программа. Без программы робот - просто куча деталей, как машина без водителя. А без железа программа - просто текст в компьютере. Вместе они становятся роботом, который может работать.",emoji:"⚙️"}]},{name:"Уровень 5 — Алго-путь: стрелки",short:"\uD83C\uDFC1 Алго-путь • Квадрат и Часовой",color:"#fb7185",accent:"#be123c",bg:"from-[#d1fae5] to-[#6ee7b7]",questions:[{id:0,label:"Вопрос 1",x:2,y:3.5,q:"Что такое линейный алгоритм? (стр. 75)",options:["Команды вразброс","Команды идут одна за другой по порядку","Команды повторяются бесконечно","Нет команд"],correct:1,explain:"Линейный — команды выполняются строго одна за другой.",hint:"\uD83D\uDCA1 Подсказка: Линейный — как линия, все по очереди, по порядку.",learnText:"Линейный алгоритм - это когда команды идут одна за другой по порядку, как по линии. Сначала шаг вперед, потом поворот, потом опять шаг. Как рецепт - делай все по очереди, не перепрыгивай. Просто и понятно.",emoji:"\uD83D\uDCCF"},{id:1,label:"Вопрос 2",x:13.8,y:3,q:"Сколько градусов в полном обороте робота? (стр. 75-76)",options:["90°","360°","180°","45°"],correct:1,explain:"Полный оборот — 360°, как круг.",hint:"\uD83D\uDCA1 Подсказка: Круг — 360 градусов, полный оборот.",learnText:"Полный оборот - это 360 градусов. Как полный круг. Если робот повернется на 360 - он вернется туда, куда смотрел сначала. Половина круга - 180, четверть - 90. Запомни - круг это 360.",emoji:"\uD83D\uDD04"},{id:2,label:"Вопрос 3",x:13,y:11,q:"Как заставить робота двигаться по квадрату? (стр. 76)",options:["Идти прямо бесконечно","Идти 2 сек + поворот 90° — повторить 4 раза","Только поворачивать","Стоять"],correct:1,explain:"Квадрат: вперед, поворот 90°, вперед, поворот 90°... 4 раза.",hint:"\uD83D\uDCA1 Подсказка: У квадрата 4 стороны и 4 поворота по 90°.",learnText:"Чтобы робот проехал квадратом, нужно: ехать 2 секунды вперед, повернуть на 90 градусов, и повторить 4 раза. У квадрата 4 стороны и 4 угла по 90. Как нарисовать квадрат на бумаге - 4 одинаковых стороны.",emoji:"⬜"},{id:3,label:"Вопрос 4",x:2.5,y:10,q:"Робот 'Часовой' что делает? (стр. 76-77)",options:["Спит","Охраняет объект, ходит вперед-назад","Только крутится","Только пищит"],correct:1,explain:"Часовой охраняет, ходит туда-сюда и смотрит по сторонам.",hint:"\uD83D\uDCA1 Подсказка: Часовой как охранник — ходит по посту.",learnText:"Робот Часовой охраняет объект. Он ходит вперед-назад по посту, как настоящий часовой, и смотрит по сторонам. Если видит чужого - сигналит. Это охранник, только железный. Он всегда на посту.",emoji:"\uD83D\uDEE1️"},{id:4,label:"Вопрос 5",x:8,y:8.8,q:"Что нужно для соревнований роботов?",options:["Только роботы","Роботы + программы + правила","Только правила","Ничего"],correct:1,explain:"Соревнования — нужны роботы, программы и правила.",hint:"\uD83D\uDCA1 Подсказка: Чтобы соревноваться, нужны участники (роботы) и правила.",learnText:"Для соревнований роботов нужны роботы, программы и правила. Как в спорте - нужны участники, тренировка и правила игры. Роботы соревнуются кто быстрее проедет трассу или выполнит задание. Побеждает самый умный и быстрый.",emoji:"\uD83C\uDFC1"}]}],La=[{emoji:"\uD83E\uDD49",title:"Исследователь битов",desc:"Ты понял как хранится информация!",color:"#92400e",bg:"from-amber-200 via-yellow-100 to-orange-200"},{emoji:"\uD83D\uDD24",title:"Расшифровщик кодов",desc:"Ты расшифровал азбуку компьютера!",color:"#6d28d9",bg:"from-violet-200 via-purple-100 to-fuchsia-200"},{emoji:"\uD83C\uDFA8",title:"Художник цвета",desc:"Ты включил свет в школе! RGB покорен!",color:"#be185d",bg:"from-pink-200 via-rose-100 to-amber-200"},{emoji:"\uD83E\uDD16",title:"Друг роботов",desc:"Ты починил всех роботов-помощников!",color:"#0e7490",bg:"from-cyan-200 via-sky-100 to-violet-200"},{emoji:"\uD83C\uDFC6",title:"Победите   <div id="qr-card">
    <h2 style="font-family:system-ui;font-weight:800;font-size:18px;margin:0 0 8px;">QR для телефона</h2>
    <div id="qr-target" style="display:flex;justify-content:center;padding:12px;background:#f8fafc;border-radius:16px;"></div>
    <p id="qr-url" style="font-family:monospace;font-size:10px;color:#94a3b8;margin:10px 0 0;word-break:break-all;"></p>
    <button onclick="document.getElementById('qr-overlay').classList.remove('open')" style="margin-top:14px;width:100%;padding:12px;background:#0f172a;color:white;border:0;border-radius:12px;font-weight:700;">Закрыть</button>
  </div>
</div>
<button id="fab-qr" style="position:fixed;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:999998;width:48px;height:48px;border-radius:14px;background:#0f172a;color:white;border:0;box-shadow:0 8px 20px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;font-size:20px;">QR</button>

<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<script>
(function(){
  const url = "https://asulim2016-star.github.io/my-site/game2.html";
  const el = document.getElementById('qr-target');
  const urlEl = document.getElementById('qr-url');
  if(urlEl) urlEl.textContent = url;
  if(el && window.QRCode){ new QRCode(el, {text:url,width:200,height:200,correctLevel:QRCode.CorrectLevel.H}); }
  document.getElementById('fab-qr').onclick = ()=> document.getElementById('qr-overlay').classList.add('open');
  
  // Фикс высоты при появлении клавиатуры
  const root = document.getElementById('root');
  let initialVH = window.innerHeight;
  window.addEventListener('resize', ()=>{
    if(window.innerHeight < initialVH * 0.75){
      document.body.style.height = window.innerHeight + 'px';
      if(root) root.style.height = window.innerHeight + 'px';
    } else {
      document.body.style.height = '100dvh';
      if(root) root.style.height = '100dvh';
    }
  });
  // Запрет двойного тапа зума
  document.addEventListener('touchend', e=>{ const now=Date.now(); if(now - (window._lastTouch||0) < 300) e.preventDefault(); window._lastTouch=now; }, {passive:false});
})();
</script>
<script>if('serviceWorker' in navigator){ window.addEventListener('load', ()=> navigator.serviceWorker.register('./sw.js').catch(()=>{})); }</script>

</body>
